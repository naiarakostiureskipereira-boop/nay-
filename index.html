<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Em Busca da Cidade Perdida</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header>
      <h1>Em Busca da Cidade Perdida de Krato</h1>
    </header>
    
    <main>
      <div id="story-text" class="story-box">
        <!-- O texto da história será inserido aqui via JavaScript -->
      </div>
      
      <div id="options-container" class="options-box">
        <!-- Os botões de escolha aparecerão aqui -->
      </div>
    </main>
    
    <footer>
      <button id="restart-btn" class="restart-btn hidden">Jogar Novamente</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
